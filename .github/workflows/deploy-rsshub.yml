name: Deploy RSSHub to Cloudflare

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: rsshub-cloudflare-production

jobs:
    deploy:
        if: github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Deploy RSSHub
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}
              run: |
                  : "${CLOUDFLARE_API_TOKEN:?Missing repository secret CLOUDFLARE_API_TOKEN}"
                  : "${CLOUDFLARE_ACCOUNT_ID:?Missing repository variable CLOUDFLARE_ACCOUNT_ID}"
                  : "${RSSHUB_ACCESS_KEY:?Missing repository secret RSSHUB_ACCESS_KEY}"

                  umask 077
                  secrets_dir="$(mktemp -d "$RUNNER_TEMP/rsshub-secrets.XXXXXX")"
                  secrets_file="$secrets_dir/secrets.json"
                  trap 'rm -f "$secrets_file"; rmdir "$secrets_dir"' EXIT
                  node -e 'process.stdout.write(JSON.stringify({ACCESS_KEY: process.env.RSSHUB_ACCESS_KEY}))' > "$secrets_file"
                  pnpm exec cf deploy --secrets-file "$secrets_file"
