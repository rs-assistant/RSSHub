name: Deploy RSSHub to Cloudflare

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: rsshub-cloudflare-production

jobs:
    deploy:
        if: github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Deploy RSSHub
              shell: bash
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}
              run: |
                  : "${CLOUDFLARE_API_TOKEN:?Missing repository secret CLOUDFLARE_API_TOKEN}"
                  : "${CLOUDFLARE_ACCOUNT_ID:?Missing repository variable CLOUDFLARE_ACCOUNT_ID}"
                  : "${RSSHUB_ACCESS_KEY:?Missing repository secret RSSHUB_ACCESS_KEY}"

                  CLOUDFLARE_KV_NAMESPACE_ID="$(pnpm exec wrangler kv namespace list | jq -r 'map(select(.title == "rsshub-cache")) | first | .id // empty')"
                  export CLOUDFLARE_KV_NAMESPACE_ID

                  umask 077
                  secrets_dir="$(mktemp -d "$RUNNER_TEMP/rsshub-secrets.XXXXXX")"
                  secrets_file="$secrets_dir/secrets.json"
                  trap 'rm -f "$secrets_file"; rmdir "$secrets_dir"' EXIT
                  node -e 'process.stdout.write(JSON.stringify({ACCESS_KEY: process.env.RSSHUB_ACCESS_KEY}))' > "$secrets_file"
                  pnpm exec cf deploy --secrets-file "$secrets_file"

            - name: Verify protected RSS feed
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}
              run: |
                  node --input-type=module <<'NODE'
                  import { createHash } from 'node:crypto';

                  const { CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, RSSHUB_ACCESS_KEY } = process.env;
                  const account = encodeURIComponent(CLOUDFLARE_ACCOUNT_ID);
                  const options = { redirect: 'error', signal: AbortSignal.timeout(30_000) };
                  const metadata = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/subdomain`, {
                      ...options,
                      headers: { Authorization: `Bearer ${CLOUDFLARE_API_TOKEN}` },
                  });
                  if (!metadata.ok) {
                      throw new Error(`Could not look up the Workers subdomain (HTTP ${metadata.status})`);
                  }
                  const { result } = await metadata.json();
                  if (!/^[a-z0-9][a-z0-9-]*$/.test(result?.subdomain ?? '')) {
                      throw new Error('No valid workers.dev subdomain is configured');
                  }

                  const path = '/test/1';
                  const feed = new URL(path, `https://rsshub.${result.subdomain}.workers.dev`);
                  const code = createHash('md5').update(path + RSSHUB_ACCESS_KEY).digest('hex');
                  const [anonymous, invalid, authorized] = await Promise.all([
                      fetch(feed, options),
                      fetch(new URL('?code=incorrect', feed), options),
                      fetch(new URL(`?code=${code}`, feed), options),
                  ]);
                  if (anonymous.status !== 403 || invalid.status !== 403 || authorized.status !== 200) {
                      throw new Error(`Unexpected feed status: anonymous ${anonymous.status}, wrong code ${invalid.status}, valid code ${authorized.status}`);
                  }
                  if (authorized.headers.get('cache-control') !== 'private, no-store' || !(await authorized.text()).includes('<rss')) {
                      throw new Error('Authorized response must be RSS and use private, no-store caching');
                  }
                  console.log('Verified: anonymous 403, wrong code 403, valid code 200 RSS with private, no-store caching.');
                  NODE
